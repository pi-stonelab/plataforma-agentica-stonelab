services:
  db:
    image: postgres:16-alpine   # tem versão ARM64 (Raspberry Pi)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stonelab}
      POSTGRES_USER: ${POSTGRES_USER:-stonelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"   # só acessível da própria máquina
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stonelab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stonelab}
      MOCK_DATABASE_URL: ""
      MOCK_ESCRITA_DATABASE_URL: ""
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - dados_mock:/app/dados_locais
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  dados_postgres:
  dados_mock:
